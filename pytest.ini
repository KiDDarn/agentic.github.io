[pytest]
# Only discover tests in the `tests` directory to avoid running integration scripts
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Optionally add -q for quiet output in CI
addopts = -q

# Ignore implementation/ and other directories that contain integration scripts
norecursedirs = implementation .venv .git tests/integration
