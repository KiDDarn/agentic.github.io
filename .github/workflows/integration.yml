name: Integration tests

on:
  workflow_dispatch: {}

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-integration.txt', '**/constraints.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Restore service account from secret
      env:
        SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      run: |
        if [ -z "$SERVICE_ACCOUNT_JSON" ]; then echo "Missing SERVICE_ACCOUNT_JSON secret"; exit 1; fi
        echo "$SERVICE_ACCOUNT_JSON" > service_account.json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f constraints.txt ]; then
          pip install -r requirements.txt -c constraints.txt
          if [ -f requirements-integration.txt ]; then
            pip install -r requirements-integration.txt -c constraints.txt
          fi
        else
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-integration.txt ]; then
            pip install -r requirements-integration.txt
          fi
        fi

    - name: Run integration tests
      run: |
        pytest -q tests/integration
      env:
        PYTHONPATH: ${{ github.workspace }}
